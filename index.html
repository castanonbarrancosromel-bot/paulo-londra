<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paulo Londra – Tal Vez ♪ Karaoke</title>
  <meta name="description" content="Karaoke interactivo de Tal Vez - Paulo Londra ft. Ovy On The Drums"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

  <!-- Background layers -->
  <div class="bg-base"></div>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="bg-orb orb-c"></div>
  <canvas id="bgCanvas" class="bg-canvas"></canvas>

  <!-- Header -->
  <header class="top-bar">
    <div class="song-meta">
      <span class="song-artist">PAULO LONDRA</span>
      <span class="dot">·</span>
      <span class="song-title-sm">Tal Vez</span>
    </div>
    <div class="section-pill" id="sectionPill">♪</div>
  </header>

  <!-- ===== KARAOKE STAGE ===== -->
  <main class="stage" id="stage">

    <!-- Idle / Pre-play screen -->
    <div class="idle-screen" id="idleScreen">
      <div class="idle-vinyl" id="idleVinyl">
        <div class="idle-label">
          <span>PAULO</span>
          <span>LONDRA</span>
        </div>
      </div>
      <h1 class="idle-song">TAL VEZ</h1>
      <p class="idle-feat">ft. Ovy On The Drums</p>
      <button class="idle-play-btn" id="idlePlayBtn">
        <svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26"><path d="M8 5v14l11-7z"/></svg>
        Reproducir
      </button>
      <p class="idle-hint" id="embedErrorMsg" style="display:none">
        ⚠️ El video no permite incrustar.<br/>
        <a href="https://youtu.be/bX3S-_jUauc" target="_blank">Ábrelo en YouTube</a> y usa los controles manuales.
      </p>
    </div>

    <!-- Lyric stack (active state) -->
    <div class="lyric-stack" id="lyricStack" style="display:none"></div>

    <!-- Chorus glow pulse -->
    <div class="chorus-pulse" id="chorusPulse"></div>

  </main>

  <!-- ===== YOUTUBE MINI WIDGET ===== -->
  <div class="yt-widget" id="ytWidget">
    <div class="yt-widget-bar">
      <span class="yt-label">▶ Video Oficial</span>
      <button class="yt-min-btn" id="ytMinBtn">−</button>
    </div>
    <div class="yt-frame-wrap" id="ytFrameWrap">
      <div id="yt-player"></div>
    </div>
  </div>

  <!-- ===== PLAYER BAR ===== -->
  <footer class="player-bar">

    <button class="play-pause-btn" id="playBtn" disabled>
      <svg class="ico-play" viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M8 5v14l11-7z"/></svg>
      <svg class="ico-pause" viewBox="0 0 24 24" fill="currentColor" width="22" height="22" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>

    <div class="seek-wrap">
      <div class="seek-bar" id="seekBar">
        <div class="seek-progress" id="seekProgress"></div>
        <div class="seek-thumb" id="seekThumb"></div>
      </div>
    </div>

    <span class="time-txt" id="timeTxt">0:00</span>

    <button class="vid-toggle-btn" id="vidToggleBtn" title="Mostrar/ocultar video">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
        <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
      </svg>
    </button>

  </footer>

  <script src="app.js"></script>
</body>
</html>
